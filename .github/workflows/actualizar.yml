name: Actualizar Alturas Paraná

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 AM UTC (5:00 AM Argentina)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite probarlo/ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ejecutar script de actualización
        run: |
          node actualizar.js

      - name: Guardar cambios en el repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Bot Monitor Paraná"
          git config --global user.email "bot@users.noreply.github.com"
          git add datos.json
          git commit -m "🤖 Actualización automática de alturas" || exit 0
          git push
